# this is name of the workflow that will be displayed in the Actions Tab
name: CICD

# Manual click (deliver) workflow whenever user needs
on:
  workflow_dispatch: 
    inputs:
      environment:
        description: This is the environment value where this workflow runs
        default: 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging

jobs:
  # every job needs seperate runner, its called parallelism
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v
  build:
    runs-on: ubuntu-latest
    needs: [code]
    steps:
       - name: build docker container
         run: echo "docker container build"
